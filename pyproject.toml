[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zepp-mcp"
version = "0.1.0"
description = "Free, open-source MCP server to connect Amazfit/Zepp health data to Claude"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["amazfit", "zepp", "mcp", "claude", "health", "stress"]

dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
zepp-mcp = "zepp_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zepp_mcp"]
